[workspace]
resolver = "2"
members = ["types", "bazaar", "stall", "tusdc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chinesepowered/hack-nearhacks"

[workspace.dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
capy-types = { path = "types" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
